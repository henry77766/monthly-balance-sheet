<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>資產表</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F1F2EE">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --paper:#F1F2EE;
  --card:#FFFFFF;
  --ink:#414C56;
  --ink-2:#7E8A91;
  --ink-3:#AAB3B6;
  --line:#E7EAE3;
  --accent:#8FA8B8;
  --gain:#6E9179;
  --loss:#C08E88;
  --c1:#93AAB8; --c2:#9BB095; --c3:#CDB795; --c4:#AA9BB0; --c5:#BFA098;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --shadow:0 .06rem .12rem rgba(65,76,86,.05),0 .38rem 1.1rem rgba(65,76,86,.06);
  --navh:4rem;
}
/* 整個介面以螢幕寬度為基準等比縮放 */
html{font-size:clamp(16px,4.35vw,32px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:1rem;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:var(--sans);color:inherit}

.topbar{
  position:fixed;top:0;left:0;right:0;z-index:30;
  padding:calc(env(safe-area-inset-top) + .88rem) 1.25rem .75rem;
  background:rgba(241,242,238,.92);
  backdrop-filter:saturate(180%) blur(.9rem);
  -webkit-backdrop-filter:saturate(180%) blur(.9rem);
  display:flex;align-items:center;gap:.75rem;
}
.topbar h1{margin:0;font-size:1.06rem;font-weight:600;letter-spacing:.03em}
.mpill{
  margin-left:auto;position:relative;display:inline-flex;align-items:center;
  background:var(--card);border:.06rem solid var(--line);border-radius:99rem;
  padding:.44rem .88rem;box-shadow:var(--shadow);
}
.mpill span{font-family:var(--mono);font-size:.81rem;letter-spacing:.02em}
.mpill input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none}

main{
  padding:calc(env(safe-area-inset-top) + 3.9rem) 1.25rem calc(var(--navh) + env(safe-area-inset-bottom) + 1.6rem);
  max-width:34rem;margin:0 auto;
}
.view{display:none}
.view.on{display:block;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(.4rem)}to{opacity:1;transform:none}}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  height:calc(var(--navh) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(.9rem);
  -webkit-backdrop-filter:saturate(180%) blur(.9rem);
  border-top:.06rem solid var(--line);
  display:flex;
}
.tab{
  flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.19rem;
  color:var(--ink-3);font-size:.69rem;letter-spacing:.06em;padding:0;
}
.tab svg{width:1.44rem;height:1.44rem;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}

.card{
  background:var(--card);border-radius:1.25rem;padding:1.25rem;
  box-shadow:var(--shadow);margin-bottom:.88rem;
}
.hero{padding:1.5rem 1.38rem 1.25rem}
.hero .lab{font-size:.75rem;color:var(--ink-2);letter-spacing:.14em;margin:0 0 .5rem}
.hero .fig{
  font-family:var(--mono);font-size:2.38rem;font-weight:500;line-height:1.1;margin:0;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.hero .fig i{font-style:normal;font-size:.94rem;color:var(--ink-2);margin-right:.44rem}
.chips{display:flex;gap:.63rem;margin-top:1.13rem}
.chip{flex:1;background:var(--paper);border-radius:.88rem;padding:.69rem .81rem;min-width:0}
.chip .k{font-size:.69rem;color:var(--ink-2);letter-spacing:.08em;display:block}
.chip .v{
  font-family:var(--mono);font-size:1rem;font-weight:500;display:block;margin-top:.19rem;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip .v.sm{font-size:.78rem;font-family:var(--sans);color:var(--ink-3);font-weight:400}
.up{color:var(--gain)} .down{color:var(--loss)}

.ctitle{font-size:.75rem;color:var(--ink-2);letter-spacing:.14em;margin:0 0 .94rem}
.bar{display:flex;height:.88rem;border-radius:.5rem;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.leg{margin-top:1rem}
.leg .r{display:flex;align-items:center;gap:.63rem;padding:.44rem 0;font-size:.91rem}
.leg .d{width:.56rem;height:.56rem;border-radius:50%;flex:none}
.leg .a{margin-left:auto;font-family:var(--mono);font-size:.88rem;font-variant-numeric:tabular-nums}
.leg .p{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);width:3rem;text-align:right}

.steps{display:flex;gap:.38rem;margin-bottom:1.13rem}
.steps i{flex:1;height:.19rem;border-radius:.13rem;background:var(--line);transition:background .3s}
.steps i.on{background:var(--accent)}
.stepname{font-size:1.25rem;font-weight:600;margin:0 0 .25rem;letter-spacing:.02em}
.stepsub{font-size:.81rem;color:var(--ink-2);margin:0 0 1.13rem}

.row{padding:.94rem 0;border-bottom:.06rem solid var(--line)}
.row:last-child{border-bottom:none;padding-bottom:.25rem}
.row label{display:block;font-size:.94rem;margin-bottom:.13rem}
.row .sub{display:block;font-size:.75rem;color:var(--ink-3);margin-bottom:.56rem;line-height:1.5}
.ib{display:flex;align-items:center;gap:.56rem}
.ib input{
  flex:1;width:100%;
  font-family:var(--mono);font-size:1.38rem;font-weight:500;
  font-variant-numeric:tabular-nums;text-align:right;
  color:var(--ink);background:var(--paper);
  border:.09rem solid transparent;border-radius:.88rem;
  padding:.81rem .94rem;-webkit-appearance:none;appearance:none;
}
.ib input:focus{outline:none;background:#fff;border-color:var(--accent)}
.ib input::placeholder{color:var(--ink-3);font-weight:400}
.ib em{font-style:normal;font-size:.81rem;color:var(--ink-2);width:1rem}
.calcline{
  display:flex;justify-content:space-between;align-items:center;
  padding:.88rem .13rem 0;font-size:.81rem;color:var(--ink-2);
}
.calcline b{font-family:var(--mono);font-size:1.06rem;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

.nav2{display:flex;gap:.63rem;margin-top:1.13rem}
.btn{
  flex:1;border:none;border-radius:1rem;padding:1rem 0;
  font-size:1rem;font-weight:600;letter-spacing:.06em;cursor:pointer;
  background:var(--ink);color:#fff;box-shadow:var(--shadow);
}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--ink-2);flex:0 0 5.75rem;box-shadow:none;border:.06rem solid var(--line)}

.ent{
  display:flex;align-items:center;gap:.75rem;width:100%;
  background:none;border:none;border-bottom:.06rem solid var(--line);
  padding:.94rem .13rem;cursor:pointer;text-align:left;
}
.ent:last-child{border-bottom:none}
.ent .ym{font-family:var(--mono);font-size:.81rem;color:var(--ink-2);width:3.9rem;flex:none}
.ent .sp{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);width:4.5rem;flex:none;text-align:right}
.ent .cg{font-family:var(--mono);font-size:.78rem;width:4.6rem;flex:none;text-align:right}
.ent .nv{font-family:var(--mono);font-size:1.06rem;margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.enth{display:flex;gap:.75rem;padding:0 .13rem .56rem;font-size:.66rem;color:var(--ink-3);border-bottom:.06rem solid var(--line)}
.enth .ym{width:3.9rem;flex:none} .enth .cg{width:4.6rem;flex:none;text-align:right}
.enth .sp{width:4.5rem;flex:none;text-align:right} .enth .nv{margin-left:auto}

.blank{text-align:center;padding:1.88rem .63rem}
.blank p{color:var(--ink-2);font-size:.88rem;line-height:1.9;margin:0 0 1.13rem}
.mini{display:flex;gap:.63rem;margin-top:.25rem}
.mini button{
  flex:1;background:var(--paper);border:none;border-radius:.81rem;
  color:var(--ink-2);font-size:.81rem;padding:.81rem 0;cursor:pointer;
}
.danger{
  display:block;width:100%;background:none;border:none;color:var(--ink-3);
  font-size:.81rem;padding:1rem 0 0;cursor:pointer;
}
.warn{
  background:#F7EEEC;border-radius:1rem;padding:.88rem 1rem;margin-bottom:.88rem;
  font-size:.81rem;line-height:1.75;color:#8A6763;
}
.toast{
  position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 1.25rem);
  transform:translateX(-50%);z-index:40;
  background:rgba(65,76,86,.95);color:#fff;padding:.75rem 1.38rem;border-radius:1.38rem;
  font-size:.88rem;opacity:0;pointer-events:none;
}
.toast.show{animation:tl 2s ease-out}
@keyframes tl{0%{opacity:0;transform:translateX(-50%) translateY(.5rem)}15%,80%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .view.on,.toast.show{animation-duration:.01s}
  .bar i{transition:none}
}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="ttl">總覽</h1>
  <label class="mpill"><span id="mtxt">2026/08</span><input type="month" id="ym"></label>
</div>

<main>

  <!-- 總覽 -->
  <section class="view on" id="v-home">
    <div class="card hero">
      <p class="lab">淨值</p>
      <p class="fig" id="net"><i>NT$</i>0</p>
      <div class="chips">
        <div class="chip"><span class="k">較上月</span><span class="v sm" id="delta">第一個月</span></div>
        <div class="chip"><span class="k">本月支出</span><span class="v sm" id="spend">下個月才有</span></div>
      </div>
    </div>

    <div class="card">
      <p class="ctitle">錢放在哪</p>
      <div class="bar" id="bar"></div>
      <div class="leg" id="leg"></div>
    </div>

    <div class="card">
      <p class="ctitle">資產與負債</p>
      <div class="calcline"><span>總資產</span><b id="ta">0</b></div>
      <div class="calcline"><span>總負債</span><b id="tl">0</b></div>
    </div>
  </section>

  <!-- 填寫 -->
  <section class="view" id="v-edit">
    <div class="warn" id="warn" hidden></div>
    <div class="steps"><i class="on"></i><i></i><i></i></div>

    <div class="card" id="step0">
      <p class="stepname">資產</p>
      <p class="stepsub">手上有多少，單位台幣</p>
      <div class="row">
        <label for="cash">現金</label><span class="sub">所有活存加起來</span>
        <div class="ib"><input id="cash" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="row">
        <label for="stock">台股</label><span class="sub">目前市值</span>
        <div class="ib"><input id="stock" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="row">
        <label for="jpy">日幣</label><span class="sub">原幣金額</span>
        <div class="ib"><input id="jpy" inputmode="decimal" placeholder="0"><em>円</em></div>
      </div>
      <div class="row">
        <label for="rate">日幣匯率</label><span class="sub">1 円換多少台幣</span>
        <div class="ib"><input id="rate" inputmode="decimal" placeholder="0.2"><em></em></div>
      </div>
      <div class="row">
        <label for="crypto">加密貨幣</label><span class="sub">折成台幣的市值</span>
        <div class="ib"><input id="crypto" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="row">
        <label for="ins">保單解約金</label><span class="sub">查保單對照表，一年更新一次就好</span>
        <div class="ib"><input id="ins" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="calcline"><span>總資產</span><b id="ta2">0</b></div>
    </div>

    <div class="card" id="step1" hidden>
      <p class="stepname">負債</p>
      <p class="stepsub">還欠別人多少</p>
      <div class="row">
        <label for="cc">信用卡</label><span class="sub">這期還沒繳的金額</span>
        <div class="ib"><input id="cc" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="row">
        <label for="loan">學貸</label><span class="sub">還欠多少</span>
        <div class="ib"><input id="loan" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="calcline"><span>總負債</span><b id="tl2">0</b></div>
    </div>

    <div class="card" id="step2" hidden>
      <p class="stepname">這個月的金流</p>
      <p class="stepsub">用來反推你花了多少</p>
      <div class="row">
        <label for="income">收入</label><span class="sub">薪轉加上其他進帳</span>
        <div class="ib"><input id="income" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="row">
        <label for="moved">轉去投資</label><span class="sub">自己搬去買股票或幣的錢，保費不用填</span>
        <div class="ib"><input id="moved" inputmode="decimal" placeholder="0"><em></em></div>
      </div>
      <div class="calcline"><span>這個月支出</span><b id="sp2">—</b></div>
    </div>

    <div class="nav2">
      <button class="btn sec" id="back" hidden>上一步</button>
      <button class="btn" id="next">下一步</button>
    </div>
  </section>

  <!-- 紀錄 -->
  <section class="view" id="v-log">
    <div class="card">
      <p class="ctitle">歷月紀錄</p>
      <div class="enth"><span class="ym">月份</span><span class="cg">增減</span><span class="sp">支出</span><span class="nv">淨值</span></div>
      <div id="list"></div>
    </div>
    <div class="card">
      <p class="ctitle">備份</p>
      <p style="font-size:.81rem;color:var(--ink-2);margin:0 0 .88rem;line-height:1.75">資料存在這台手機的瀏覽器裡。換手機或清除瀏覽資料會不見，偶爾備份一次比較保險。</p>
      <div class="mini">
        <button id="copyout">複製備份文字</button>
        <button id="pastein">貼上備份還原</button>
      </div>
      <button class="danger" id="wipe">清除全部紀錄</button>
    </div>
  </section>

</main>

<nav class="tabbar">
  <button class="tab on" data-v="home">
    <svg viewBox="0 0 24 24"><path d="M4 19V9m5 10V5m5 14v-7m5 7V8"/></svg>總覽
  </button>
  <button class="tab" data-v="edit">
    <svg viewBox="0 0 24 24"><path d="M12 20h9M4 20h3l10-10a2.1 2.1 0 0 0-3-3L4 17v3z"/></svg>填寫
  </button>
  <button class="tab" data-v="log">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>紀錄
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const KEY='balancesheet:months';
const F=['cash','stock','jpy','rate','crypto','ins','cc','loan','income','moved'];
const MIX=[{k:'cash',n:'現金',c:'var(--c1)'},{k:'stock',n:'台股',c:'var(--c2)'},
           {k:'jpytwd',n:'日幣',c:'var(--c3)'},{k:'crypto',n:'加密貨幣',c:'var(--c4)'},
           {k:'ins',n:'保單',c:'var(--c5)'}];
let months=[], step=0;
const $=i=>document.getElementById(i);
const num=v=>{const n=parseFloat(String(v).replace(/[,\s]/g,''));return isFinite(n)?n:0};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const sgn=n=>(n>=0?'+':'−')+fmt(Math.abs(n));
const nowYM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

const store={
  mode:'none',
  async init(){
    try{localStorage.setItem('p','1');localStorage.removeItem('p');this.mode='local';return}catch(e){}
    try{if(!window.storage)throw 0;await window.storage.set('p','1');this.mode='claude';return}catch(e){}
  },
  async get(){
    if(this.mode==='local')return localStorage.getItem(KEY);
    if(this.mode==='claude'){const r=await window.storage.get(KEY);return r?r.value:null}
    return null;
  },
  async set(v){
    if(this.mode==='local'){localStorage.setItem(KEY,v);return}
    if(this.mode==='claude'){await window.storage.set(KEY,v);return}
    throw new Error('no store');
  },
  async del(){
    if(this.mode==='local'){localStorage.removeItem(KEY);return}
    if(this.mode==='claude'){await window.storage.delete(KEY);return}
  }
};

function read(){
  const o={ym:$('ym').value||nowYM()};
  F.forEach(f=>o[f]=num($(f).value));
  if(!o.rate)o.rate=0.2;
  return o;
}
function prevOf(ym){
  return months.filter(m=>m.ym<ym).sort((a,b)=>a.ym<b.ym?1:-1)[0]||null;
}
function calc(m,p){
  const jpytwd=m.jpy*m.rate;
  const assets=m.cash+m.stock+jpytwd+m.crypto+m.ins;
  const liab=m.cc+m.loan;
  const net=assets-liab;
  let delta=null,spend=null;
  if(p){
    const pn=p.cash+p.stock+p.jpy*p.rate+p.crypto+p.ins-p.cc-p.loan;
    delta=net-pn;
    spend=p.cash+m.income-m.moved-m.cash;
  }
  return {jpytwd,assets,liab,net,delta,spend};
}
function drawMix(m,r){
  const bar=$('bar'),leg=$('leg');
  const v={cash:m.cash,stock:m.stock,jpytwd:r.jpytwd,crypto:m.crypto,ins:m.ins};
  bar.innerHTML='';leg.innerHTML='';
  if(r.assets<=0){leg.innerHTML='<p style="font-size:.81rem;color:var(--ink-3);margin:.38rem 0 0">還沒有資料。到「填寫」把數字補上就會畫出來。</p>';return}
  MIX.forEach(s=>{
    const x=v[s.k];if(x<=0)return;
    const pc=x/r.assets*100;
    const i=document.createElement('i');
    i.style.width=pc+'%';i.style.background=s.c;bar.appendChild(i);
    const d=document.createElement('div');d.className='r';
    d.innerHTML='<span class="d" style="background:'+s.c+'"></span><span>'+s.n+
      '</span><span class="a">'+fmt(x)+'</span><span class="p">'+pc.toFixed(1)+'%</span>';
    leg.appendChild(d);
  });
}
function refresh(){
  const m=read(),r=calc(m,prevOf(m.ym));
  $('mtxt').textContent=m.ym.replace('-','/');
  $('net').innerHTML='<i>NT$</i>'+fmt(r.net);
  $('ta').textContent=fmt(r.assets);$('tl').textContent=fmt(r.liab);
  $('ta2').textContent=fmt(r.assets);$('tl2').textContent=fmt(r.liab);
  const d=$('delta');
  if(r.delta===null){d.textContent='第一個月';d.className='v sm'}
  else{d.textContent=sgn(r.delta);d.className='v '+(r.delta>=0?'up':'down')}
  const s=$('spend');
  if(r.spend===null){s.textContent='下個月才有';s.className='v sm'}
  else{s.textContent=fmt(r.spend);s.className='v'}
  $('sp2').textContent=r.spend===null?'—':fmt(r.spend);
  drawMix(m,r);
}
function drawList(){
  const el=$('list');
  if(!months.length){
    el.innerHTML='<div class="blank"><p>還沒有紀錄。<br>到「填寫」走完三步就會出現第一列。</p></div>';
    return;
  }
  el.innerHTML='';
  [...months].sort((a,b)=>a.ym<b.ym?1:-1).forEach(m=>{
    const r=calc(m,prevOf(m.ym));
    const b=document.createElement('button');b.className='ent';
    b.innerHTML='<span class="ym">'+m.ym.replace('-','/')+'</span>'+
      '<span class="cg '+(r.delta===null?'':(r.delta>=0?'up':'down'))+'">'+(r.delta===null?'—':sgn(r.delta))+'</span>'+
      '<span class="sp">'+(r.spend===null?'—':fmt(r.spend))+'</span>'+
      '<span class="nv">'+fmt(r.net)+'</span>';
    b.onclick=()=>{loadMonth(m.ym);go('edit')};
    el.appendChild(b);
  });
}
function loadMonth(ym){
  const m=months.find(x=>x.ym===ym);
  $('ym').value=ym;
  if(m)F.forEach(f=>$(f).value=m[f]===0?'':m[f]);
  setStep(0);refresh();
}
function carry(){
  const p=prevOf($('ym').value||nowYM());
  if(!p)return;
  ['rate','ins','loan'].forEach(f=>{if(!$(f).value)$(f).value=p[f]||''});
}
function go(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  $('v-'+v).classList.add('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  $('ttl').textContent={home:'總覽',edit:'填寫',log:'紀錄'}[v];
  window.scrollTo(0,0);
}
function setStep(n){
  step=n;
  [0,1,2].forEach(i=>$('step'+i).hidden=(i!==n));
  document.querySelectorAll('.steps i').forEach((el,i)=>el.classList.toggle('on',i<=n));
  $('back').hidden=(n===0);
  $('next').textContent=(n===2?'儲存這個月':'下一步');
  window.scrollTo({top:0,behavior:'smooth'});
}
function toast(t){
  const el=$('toast');el.textContent=t;
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}
async function save(){
  const m=read();
  months=months.filter(x=>x.ym!==m.ym);months.push(m);
  drawList();refresh();
  try{await store.set(JSON.stringify(months));toast(m.ym.replace('-','/')+' 已存好')}
  catch(e){toast('沒存進去，先按備份')}
  setStep(0);go('home');
}

$('next').onclick=()=>{step<2?setStep(step+1):save()};
$('back').onclick=()=>setStep(step-1);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.v));
F.forEach(f=>$(f).addEventListener('input',refresh));
$('ym').addEventListener('change',()=>{
  const e=months.find(x=>x.ym===$('ym').value);
  if(e)loadMonth(e.ym);else{F.forEach(f=>{if(f!=='rate')$(f).value=''});carry();refresh()}
});
$('copyout').onclick=async()=>{
  const m=read(),all=months.filter(x=>x.ym!==m.ym).concat([m]);
  const t=JSON.stringify(all);
  try{await navigator.clipboard.writeText(t);toast('備份文字已複製')}
  catch(e){prompt('長按選取全部複製：',t)}
};
$('pastein').onclick=async()=>{
  const t=prompt('把備份文字貼在這裡：');if(!t)return;
  try{
    const d=JSON.parse(t);if(!Array.isArray(d))throw 0;
    months=d;try{await store.set(JSON.stringify(months))}catch(e){}
    drawList();const c=months.find(x=>x.ym===$('ym').value);
    if(c)loadMonth(c.ym);else refresh();
    toast('已還原 '+months.length+' 個月');
  }catch(e){toast('這段文字看起來不完整')}
};
$('wipe').onclick=async()=>{
  if(!confirm('要清除全部紀錄嗎？清掉就找不回來了。'))return;
  months=[];try{await store.del()}catch(e){}
  F.forEach(f=>$(f).value='');$('rate').value=0.2;
  drawList();refresh();toast('已經清空了');
};

(async function boot(){
  $('ym').value=nowYM();
  await store.init();
  if(store.mode==='none'){
    $('warn').hidden=false;
    $('warn').textContent='這個畫面沒辦法存檔。填完先到「紀錄」按複製備份文字，換個地方開再還原。';
  }
  try{const raw=await store.get();months=raw?JSON.parse(raw):[]}catch(e){months=[]}
  const cur=months.find(x=>x.ym===nowYM());
  if(cur)loadMonth(cur.ym);else{$('rate').value=0.2;carry()}
  drawList();refresh();
  if(!months.length)go('edit');
})();
</script>
</body>
</html>
